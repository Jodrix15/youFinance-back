# ── Render Blueprint (Infra as Code) ──────────────────────────────────────────
# La RAMA decide el entorno, no un cambio manual de yaml:
#   develop  ->  servicio UAT  ->  SPRING_PROFILES_ACTIVE=uat
#   main     ->  servicio PRO  ->  SPRING_PROFILES_ACTIVE=pro
#
# Cada servicio arranca el back, que pide su configuración al Config Server
# (CONFIG_SERVER_URI) con su perfil. Así, un push a develop despliega UAT con la
# config uat del repo youFinance-config, y un push a main despliega PRO con la pro.
#
# Los secretos (DB, JWT) NO van aquí: se marcan sync:false y se rellenan una vez
# en el dashboard de Render (Environment). Nunca se commitean.
services:
  # ── UAT ─ se despliega automáticamente desde la rama develop ─────────────────
  - type: web
    name: youfinance-back-uat
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: develop
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: uat
      # URL pública del Config Server (ajusta al host real de tu server).
      - key: CONFIG_SERVER_URI
        value: https://youfinance-config-server.onrender.com
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        sync: false

  # ── PRO ─ se despliega automáticamente desde la rama main ────────────────────
  - type: web
    name: youfinance-back-pro
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: pro
      - key: CONFIG_SERVER_URI
        value: https://youfinance-config-server.onrender.com
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        sync: false
      # Cookies / CORS de producción (ver youfinance-back-pro/application.yaml).
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: None
      - key: CORS_ALLOWED_ORIGINS
        sync: false

# El backend NO lleva configuración de entorno propia (datasource, JPA, JWT,
# Flyway…): la sirve el Config Server (repo youFinance-config) según el perfil
# activo. Aquí solo va lo mínimo para arrancar y pedir esa configuración.
spring:
  application:
    # Nombre con el que el back se identifica ante el Config Server. Determina
    # la carpeta que se sirve: youfinance-back-{perfil}.
    name: finanzas
  profiles:
    # Perfil por defecto = local. En Render lo fija SPRING_PROFILES_ACTIVE por
    # rama (develop -> uat, main -> pro) a través de render.yaml, así no hay que
    # tocar nada a mano al cambiar de entorno.
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    # Al arrancar, importa la config del Config Server. Sin 'optional:' el
    # arranque falla si el server no responde (fail-fast).
    import: "configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true

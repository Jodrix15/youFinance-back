server:
  port: ${PORT:8080}
spring:
  application:
    name: finanzas
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "baseline esquema inicial"
  datasource:
    url: jdbc:${DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_TOKEN}
  expiration: ${EXPIRATION_TOKEN}
